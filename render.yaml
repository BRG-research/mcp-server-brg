# The BRG MCP server on Render's free plan (a Blueprint: render.com → New → Blueprint → this repository).
# GitHub deploys it: after the tests pass on a push to main, .github/workflows/tests.yml calls Render's
# deploy hook (secret RENDER_DEPLOY_HOOK), so Render's own auto-deploy stays off. The service
# sleeps after 15 minutes without requests; the next request wakes it in about a minute.
services:
  - type: web
    name: brg-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8000"
