# The BRG MCP server on Render's free plan (a Blueprint: render.com → New → Blueprint → this repository).
# Render builds the Dockerfile and deploys every push to main (GitHub runs the tests on it too). The service
# sleeps after 15 minutes without requests; the next request wakes it in about a minute.
services:
  - type: web
    name: brg-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8000"
