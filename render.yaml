# The BRG MCP server on Render's free plan (a Blueprint: render.com → New → Blueprint → this repository).
# Render builds the Dockerfile and deploys every push to main (Auto-Deploy: On Commit); GitHub runs the
# tests on each push too. A build takes about 5–15 minutes on the free plan; pushes queue. The service
# sleeps after 15 minutes without requests; the next request wakes it in about a minute.
services:
  - type: web
    name: brg-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8000"
