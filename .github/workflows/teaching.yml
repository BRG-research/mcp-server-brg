# Copy the notebooks of the commands to the BRG Teaching website, so that their links open them in the browser.
# Needs the secret TEACHING_DEPLOY_KEY: the private half of an SSH deploy key with write access on BRG-teaching/Teaching.

name: Publish notebooks to Teaching

on:
  push:
    branches: [main]
    paths: ["src/brg_mcp/**", ".github/workflows/teaching.yml"]
  workflow_dispatch:

concurrency:
  group: teaching
  cancel-in-progress: false

env:
  GIT_SSH_COMMAND: ssh -i ~/.ssh/teaching -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy key
        # A pasted key often loses its line breaks or gains spaces: rebuild it from the text between the markers.
        env:
          KEY: ${{ secrets.TEACHING_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          python3 -c '
          import os, re, sys, textwrap
          key = os.environ["KEY"].replace("\r", "")
          if "PRIVATE KEY-----" in key and "-----END" in key:
              key = key.split("PRIVATE KEY-----", 1)[1].split("-----END", 1)[0]
          body = re.sub(r"\s+", "", key)  # with or without the BEGIN and END lines
          if not re.fullmatch(r"[A-Za-z0-9+/=]{100,}", body):
              kind = "empty" if not body else "a public key (ssh-ed25519 ...)" if body.startswith("ssh-") else "not a private key"
              print("::error::TEACHING_DEPLOY_KEY is {}: {} characters. Paste the private key.".format(kind, len(key)))
              sys.exit(1)
          text = "-----BEGIN OPENSSH PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 70)) + "\n-----END OPENSSH PRIVATE KEY-----\n"
          open(os.path.expanduser("~/.ssh/teaching"), "w").write(text)
          '
          chmod 600 ~/.ssh/teaching
          echo "::notice::deploy key $(ssh-keygen -l -f ~/.ssh/teaching | cut -d" " -f2)"
      - name: Clone Teaching
        run: |
          git clone --depth 1 --filter=blob:none --sparse git@github.com:BRG-teaching/Teaching.git teaching
          git -C teaching sparse-checkout set CAS/website/notebooks CAS/jupyter
      - uses: astral-sh/setup-uv@v6
      - run: uv run brg-publish teaching/CAS/website
      - name: Push Teaching
        working-directory: teaching
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add CAS/website/notebooks CAS/website/notebook-exercises.js CAS/jupyter/jupyter-lite.json
          git diff --cached --quiet && exit 0
          git commit -m "Notebooks from mcp-server-brg ${GITHUB_SHA::7}"
          git push
