[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brg-mcp"
version = "0.1.0"
description = "Knowledge and computation interface for Block Research Group workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
brg-mcp = "brg_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
