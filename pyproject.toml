[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brg-mcp"
version = "0.1.0"
description = "Knowledge and computation interface for Block Research Group workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "PyYAML>=6,<7", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]
cli = [
    "anthropic>=1.15,<2",
    "claude-agent-sdk>=0.2,<1",
    "openai>=3,<4",
    "prompt-toolkit>=3.0.50,<4",
    "rich>=13,<15",
]

[project.scripts]
brg-mcp = "brg_mcp.server:main"
brg = "brg_mcp.cli.term:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brg_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills/books-process/SKILL.md" = "brg_mcp/books_process_skill.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
